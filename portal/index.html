    body += `<div class="note">Mostrando ${arr.length} de ${all.length} actividades registradas · sincronizadas en tus dispositivos.</div>`;
  } else {
    const bars = (key, title) => { const c = aCounts(arr, key); return `<div><h3 style="font-size:13px;margin:0 0 8px">${title}</h3>${c.map(([n,v])=>`<div class="abar"><span title="${esc(n)}">${esc(n)}</span><div class="bar"><i style="width:${arr.length?100*v/arr.length:0}%"></i></div><b class="mono">${v}</b></div>`).join('')||'<div class="muted">Sin datos</div>'}</div>`; };
    body = `<div class="grid kpis" style="margin-bottom:16px">
      <div class="card kpi"><div class="l">Total de actividades</div><div class="n">${arr.length}</div></div>
      <div class="card kpi"><div class="l">En curso</div><div class="n" style="color:var(--amber)">${curso}</div></div>
      <div class="card kpi"><div class="l">Terminadas</div><div class="n" style="color:var(--ok)">${term}</div></div>
      <div class="card kpi"><div class="l">Fuera de horario</div><div class="n">${fuera}</div></div></div>
      <div class="card"><h3>Resumen de actividades</h3><div class="areports">${bars('servicio','Por servicio')}${bars('tecnologia','Por tecnología')}${bars('fabricante','Por fabricante')}${bars('responsable','Por responsable')}</div></div>
      <div class="ai-box"><h4>✦ Análisis de Claude</h4><div class="chat-out" id="a_ai" style="margin-top:0">${AI?'Pídele a Claude un análisis de estas actividades para tu reporte.':'Claude se activa al abrir el portal desde claude.ai.'}</div>${AI?'<button class="btn sm" id="a_aibtn" style="margin-top:8px">Analizar</button>':''}</div>`;
  }
  m.innerHTML = `<div class="top"><div><h1>Actividades</h1><div class="sub">Registro de servicios · Área Soporte</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="a_imp">⇪ Importar Excel</button><button class="btn sm" id="a_xl">Excel</button><button class="btn sm" id="a_wd">Word</button><button class="btn primary" id="a_new">+ Nueva actividad</button></div></div>
    <div class="toolbar"><button class="btn sm ${aTab==='registro'?'on':''}" data-atab="registro">Registros</button><button class="btn sm ${aTab==='reportes'?'on':''}" data-atab="reportes">Reportes</button></div>
    ${filters}${body}`;
  document.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { aTab=b.dataset.atab; render(); });
  ['desde','hasta','responsable','estado','tecnologia'].forEach(k => { const el=$('#af_'+k); el.onchange = () => { aF[k]=el.value; render(); }; });
  const qi = $('#af_q'); let qt; qi.oninput = () => { clearTimeout(qt); qt=setTimeout(()=>{ aF.q=qi.value; render(); const n=$('#af_q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }, 300); };
  document.querySelectorAll('[data-aed]').forEach(b => b.onclick = () => activityModal(S.activities[b.dataset.aed]));
  $('#a_new').onclick = () => activityModal();
  $('#a_xl').onclick = exportActivitiesXlsx;
  $('#a_wd').onclick = exportActivitiesDocx;
  $('#a_imp').onclick = importActivitiesXlsx;
  const ab = $('#a_aibtn'); if(ab) ab.onclick = async () => { ab.disabled=true; const out=$('#a_ai'); out.textContent='Pensando…';
    try{ await AI(`Analiza estas actividades del Área Soporte (ingeniería de redes, Chile) y entrega en español, breve y accionable: 1) resumen del período, 2) carga por responsable y tecnología, 3) actividades en curso que llevan más tiempo abiertas, 4) recomendaciones. Máximo 15 líneas. Hoy: ${isoOf(TODAY)}.\nDatos (filtrados): ${JSON.stringify(arr.slice(0,300).map(r=>({id:r.num,apertura:r.fechaApertura,cierre:r.fechaCierre,horario:r.horario,servicio:r.servicio,solicitante:r.solicitante,responsable:r.responsable,tecnologia:r.tecnologia,fabricante:r.fabricante,estado:r.estado,cliente:r.cliente,proyecto:r.proyecto,obs:String(r.observaciones||'').slice(0,200)})))}`,
      {onText:({text})=>{ out.innerHTML = lightMd(text); }, cache:false}); }
    catch(e){ out.textContent = 'No se pudo consultar a Claude.'; }
    ab.disabled=false; };
}
function activityModal(r){
  const isNew = !r; r = r || {fechaApertura:d(0), fechaCierre:'', horario:'Horario laboral', servicio:'', solicitante:'', responsable:'Alexis Arcos', tecnologia:'', fabricante:'', estado:'En curso', cliente:'', proyecto:'', observaciones:''};
  modal(`<h3>${isNew?'Registrar nueva actividad':'Editar actividad #'+r.num}</h3>
    <div class="frow"><div class="field"><label>Fecha apertura *</label><input type="date" id="ac_fa" value="${esc(r.fechaApertura)}"></div><div class="field"><label>Fecha cierre</label><input type="date" id="ac_fc" value="${esc(r.fechaCierre)}"></div></div>
    <div class="frow"><div class="field"><label>Tipo de horario *</label><select id="ac_ho">${aOpts(ALISTS.horario, r.horario)}</select></div><div class="field"><label>Estado *</label><select id="ac_es">${aOpts(ALISTS.estado, r.estado)}</select></div></div>
    <div class="frow"><div class="field"><label>Servicio *</label><select id="ac_se">${aOpts(ALISTS.servicio, r.servicio, 'Seleccionar…')}</select></div><div class="field"><label>Solicitante</label><select id="ac_so">${aOpts(ALISTS.solicitante, r.solicitante, 'Seleccionar…')}</select></div></div>
    <div class="frow"><div class="field"><label>Responsable *</label><select id="ac_re">${aOpts(ALISTS.responsable.includes(r.responsable)||!r.responsable?ALISTS.responsable:[...ALISTS.responsable, r.responsable], r.responsable)}</select></div><div class="field"><label>Tecnología</label><select id="ac_te">${aOpts(ALISTS.tecnologia, r.tecnologia, 'Seleccionar…')}</select></div></div>
    <div class="frow"><div class="field"><label>Fabricante</label><select id="ac_fb">${aOpts(ALISTS.fabricante, r.fabricante, 'Seleccionar…')}</select></div><div class="field"><label>Cliente</label><input id="ac_cl" maxlength="120" value="${esc(r.cliente)}" placeholder="Nombre del cliente"></div></div>
    <div class="field"><label>Proyecto</label><input id="ac_pr" maxlength="160" list="ac_prl" value="${esc(r.proyecto)}" placeholder="Nombre del proyecto"><datalist id="ac_prl">${projects().map(p=>`<option value="${esc(p.name)}">${esc(p.id)}</option>`).join('')}</datalist></div>
    <div class="field"><label>Observaciones</label><textarea id="ac_ob" rows="3" placeholder="Detalle, avances, acuerdos o próximos pasos…">${esc(r.observaciones)}</textarea></div>
    <div id="ac_err" style="color:var(--warn);font-size:13px;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;justify-content:space-between">${isNew?'<span></span>':'<button class="btn" id="ac_del" style="color:var(--warn)">Eliminar</button>'}<div style="display:flex;gap:8px"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ac_ok">${isNew?'Guardar actividad':'Guardar cambios'}</button></div></div>`);
  $('#ac_ok').onclick = () => {
    const v = {fechaApertura:$('#ac_fa').value, fechaCierre:$('#ac_fc').value, horario:$('#ac_ho').value, estado:$('#ac_es').value, servicio:$('#ac_se').value, solicitante:$('#ac_so').value, responsable:$('#ac_re').value, tecnologia:$('#ac_te').value, fabricante:$('#ac_fb').value, cliente:$('#ac_cl').value.trim(), proyecto:$('#ac_pr').value.trim(), observaciones:$('#ac_ob').value.trim()};
    if(!v.fechaApertura || !v.horario || !v.servicio || !v.responsable || !v.estado){ $('#ac_err').textContent='Completa los campos con *.'; return; }
    if(v.fechaCierre && v.fechaCierre < v.fechaApertura){ $('#ac_err').textContent='La fecha de cierre no puede ser anterior a la fecha de apertura.'; return; }
    if(v.estado==='Terminado' && !v.fechaCierre) v.fechaCierre = d(0);
    const num = isNew ? aNext() : r.num;
    put('activity', {...r, ...v, id:r.id||('A'+num), num});
    closeModal(); toast(isNew?'Actividad #'+num+' registrada':'Actividad actualizada'); render(); };
  if(!isNew) $('#ac_del').onclick = () => confirmBox(`¿Eliminar la actividad #${r.num}?`, () => { del('activity', r.id); render(); toast('Actividad eliminada'); });
}
async function exportActivitiesXlsx(){
  const all = activities().sort((a,b)=>a.num-b.num);
  if(!all.length){ toast('No hay actividades para exportar'); return; }
  try{
    await lib('xlsx');
    const ws = XLSX.utils.aoa_to_sheet([AHEAD, ...all.map(r=>AKEYS.map(k=>r[k]??''))]);
    ws['!cols'] = [7,14,14,18,30,24,20,22,16,14,25,30,55].map(w=>({wch:w}));
    const c = k => aCounts(all, k);
    const summary = [["REPORTE DE ACTIVIDADES"],["Fecha de exportación",new Date().toLocaleString('es-CL')],["Total de actividades",all.length],["En curso",all.filter(r=>r.estado==='En curso').length],["Terminadas",all.filter(r=>r.estado==='Terminado').length],["Fuera de horario",all.filter(r=>r.horario==='Fuera de horario').length],[],["Distribución por servicio","Cantidad"],...c('servicio'),[],["Distribución por responsable","Cantidad"],...c('responsable'),[],["Distribución por tecnología","Cantidad"],...c('tecnologia'),[],["Distribución por fabricante","Cantidad"],...c('fabricante')];
    const wr = XLSX.utils.aoa_to_sheet(summary); wr['!cols'] = [{wch:35},{wch:25}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Registro Servicios'); XLSX.utils.book_append_sheet(wb, wr, 'Resumen');
    offerFile(`Seguimiento_Actividades_${stamp()}.xlsx`, new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'})), {title:'Seguimiento de actividades en Excel'});
  }catch(e){ toast('No se pudo generar el Excel'); }
}
async function exportActivitiesDocx(){
  const arr = aFiltered(); if(!arr.length){ toast('No hay actividades con estos filtros'); return; }
  const per = [aF.desde?'desde '+fmt(aF.desde):'', aF.hasta?'hasta '+fmt(aF.hasta):''].filter(Boolean).join(' ') || 'todas las fechas';
  const tbl = (k, t) => [{h2:t},{table:[[t.replace('Por ',''),'Cantidad'], ...aCounts(arr,k).map(([n,v])=>[n,String(v)])]}];
  try{
    const u8 = await buildDocx([{h1:'Reporte de actividades · Área Soporte'},{sub:`${per}${aF.responsable?' · '+aF.responsable:''} · generado ${TODAY.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})}`},
      {h2:'Resumen'},{table:[['Total','En curso','Terminadas','Fuera de horario'],[String(arr.length), String(arr.filter(r=>r.estado==='En curso').length), String(arr.filter(r=>r.estado==='Terminado').length), String(arr.filter(r=>r.horario==='Fuera de horario').length)]]},
      ...tbl('servicio','Por servicio'), ...tbl('tecnologia','Por tecnología'), ...tbl('responsable','Por responsable'),
      {h2:'Detalle'},{table:[['ID','Apertura','Cierre','Servicio','Responsable','Tecnología','Estado','Cliente','Proyecto'], ...arr.map(r=>[String(r.num), r.fechaApertura||'', r.fechaCierre||'', r.servicio||'', r.responsable||'', r.tecnologia||'', r.estado||'', r.cliente||'', r.proyecto||''])]}]);
    offerFile(`Reporte_Actividades_${stamp()}.docx`, u8, {title:'Reporte de actividades en Word'});
  }catch(e){ toast('No se pudo generar el Word'); }
}
async function importActivitiesXlsx(){
  const f = await pickFile('.xlsx,.xls,.csv'); if(!f) return;
  try{
    await lib('xlsx');
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array', cellDates:true});
    const sn = wb.SheetNames.find(n=>/registro/i.test(n)) || wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:''});
    const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    const col = {}; AHEAD.forEach((h,i)=>col[norm(h)]=AKEYS[i]); col['tipo horario']='horario'; col['horario']='horario'; col['id']='num';
    const dateOf = v => v instanceof Date ? isoOf(v) : /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0,10) : (()=>{ const m=String(v).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); return m ? `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}` : ''; })();
    const existing = new Set(activities().map(r=>`${r.fechaApertura}|${r.servicio}|${r.cliente}|${r.proyecto}|${r.responsable}`));
    let next = aNext(); const nuevos = []; let dup = 0;
    rows.forEach(row => {
      const r = {}; Object.keys(row).forEach(k => { const key = col[norm(k)]; if(key) r[key] = row[k]; });
      if(!r.fechaApertura && !r.servicio) return;
      r.fechaApertura = dateOf(r.fechaApertura); r.fechaCierre = dateOf(r.fechaCierre);
      ['horario','servicio','solicitante','responsable','tecnologia','fabricante','estado','cliente','proyecto','observaciones'].forEach(k => r[k] = String(r[k]??'').trim());
      if(!ALISTS.estado.includes(r.estado)) r.estado = r.fechaCierre ? 'Terminado' : 'En curso';
      const key = `${r.fechaApertura}|${r.servicio}|${r.cliente}|${r.proyecto}|${r.responsable}`;
      if(existing.has(key)){ dup++; return; } existing.add(key);
      const num = next++; nuevos.push({...r, num, id:'A'+num, origen:f.name});
    });
    if(!nuevos.length){ toast(dup ? 'Todas las actividades de ese Excel ya estaban en el portal' : 'No encontré actividades en ese Excel'); return; }
    modal(`<h3>Importar actividades</h3><p>Encontré <b>${nuevos.length}</b> actividad(es) nueva(s) en <i>${esc(f.name)}</i>${dup?` y ${dup} que ya estaban (se omiten)`:''}.</p>
      <div class="note" style="margin:0 0 14px">Usa el Excel que genera tu planilla "Seguimiento de Actividades" (botón Exportar a Excel), hoja "Registro Servicios". Se les asigna un ID nuevo correlativo.</div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ai_ok">Importar ${nuevos.length}</button></div>`);
    $('#ai_ok').onclick = async () => { $('#ai_ok').disabled = true; $('#ai_ok').textContent='Importando…'; for(const a of nuevos) await put('activity', a); closeModal(); toast(`${nuevos.length} actividades importadas`); render(); };
  }catch(e){ toast('No pude leer ese Excel'); }
}

// ============ Modal ============
function modal(html){ $('#modal').innerHTML=html; $('#modalBg').classList.add('show'); document.querySelectorAll('#modal [data-close]').forEach(b=>b.onclick=closeModal); const f=$('#modal input:not([type=checkbox]):not([type=range])'); if(f && !mobile()) f.focus(); }
function closeModal(){ $('#modalBg').classList.remove('show'); if(pending) setTimeout(scheduleRender, 0); }
function confirmBox(msg, ok){ modal(`<h3>${esc(msg)}</h3><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="cb_ok" style="background:var(--warn);border-color:var(--warn)">Eliminar</button></div>`); $('#cb_ok').onclick=()=>{ closeModal(); ok(); }; }
$('#modalBg').onclick = e => { if(e.target.id==='modalBg') closeModal(); };
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz=setTimeout(()=>{ if(!isEditing()) render(); }, 250); });

// ============ Inicio ============
const h0 = location.hash.slice(1); if(VIEWS.some(v=>v[0]===h0)) current=h0;
render(); setSync('loading');
initData();
</script>
